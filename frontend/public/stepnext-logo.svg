<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Pathway Gradient -->
    <linearGradient id="snPathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Destination Dot Gradient -->
    <radialGradient id="snDotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A6B" />
      <stop offset="100%" stop-color="#F97316" />
    </radialGradient>

    <!-- Next Text Gradient -->
    <linearGradient id="snNextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Accent Underline Gradient -->
    <linearGradient id="snAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- App Icon Background Soft Glow -->
    <linearGradient id="snIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F5FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
  </defs>

  <!-- 1. LOGO APP ICON MARK -->
  <g transform="translate(4, 6)">
    <!-- Rounded App Container -->
    <rect width="66" height="66" rx="18" fill="url(#snIconBg)" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Winding 3D Pathway -->
    <path
      d="M 17 54 C 31 56, 56 48, 47 35 C 36 23, 14 27, 23 16 C 28 10, 42 12, 47 13"
      fill="none"
      stroke="url(#snPathGrad)"
      stroke-width="9.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Pathway Highlight Line -->
    <path
      d="M 18 52 C 31 54, 54 45, 45 35 C 36 24, 16 28, 24 17"
      fill="none"
      stroke="#7DD3FC"
      stroke-width="2.2"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Destination Glowing Dot -->
    <circle cx="47" cy="13" r="5.5" fill="url(#snDotGrad)" />
    <circle cx="45.5" cy="11.5" r="2" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 2. WORDMARK: StepNext -->
  <g transform="translate(80, 43)">
    <text font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="-1.2">
      <tspan fill="#0F172A">Step</tspan>
      <tspan fill="url(#snNextGrad)">Next</tspan>
    </text>
  </g>

  <!-- 3. TAGLINE: Your next step, made clearer. -->
  <g transform="translate(82, 63)">
    <text font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="13.5" fill="#334155" letter-spacing="-0.3">
      Your <tspan font-weight="800" fill="#0F172A">next step</tspan>, made clearer.
    </text>
    <!-- Accent Line under 'next step' -->
    <path d="M 33 4 Q 58 7, 83 4" stroke="url(#snAccentGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="5" r="1.2" fill="#06B6D4" />
  </g>
</svg>
